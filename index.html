<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo app</title>

    <link rel="stylesheet" href="src/style.css">

  <body>

    <div class="app-container">

      <header class="header">
        <h1 class="title">My Tasks</h1>
        <div class="header-information">
          <p class="current-date">Saturday, 7 November</p>
          <p>Saved automatically</p>
        </div>
      </header>

      <form action="#" class="form-container">
        <div class="input-group">
          <input class="input-text" type="text" placeholder="What needs doing?" required>
          <select name="priority" id="priority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
          </select>
          <input class="add-todo-btn" type="button" value="Add">
        </div>

        <div class="tasks-status-container">
          <button type="button" class="tasks-status-btn active-status-style">All <span class="all-tasks-count"></span></button>
          <button type="button" class="tasks-status-btn">Active <span class="active-tasks-count"></span></button>
          <button type="button" class="tasks-status-btn">Done <span class="done-tasks-count"></span></button>
        </div>


        <div class="no-tasks-container hidden">
          <i class="fas fa-trophy"></i>
          <p class="no-tasks-description">
            You're all caught up.
          </p>
        </div>


        <div class="todo-container">

          <p><span class="task-count">2 tasks left</span></p>

            <button type="button" class="trash-bin-button"><i class="fa-solid fa-trash-can"></i>Trash Bin</button>
